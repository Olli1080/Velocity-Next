name: Build Windows (MSVC)

on:
  workflow_dispatch:  # manual only

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_SUBMODULE_SHA=$(git rev-parse HEAD:externals/vcpkg)" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-msvc-${{ env.VCPKG_SUBMODULE_SHA }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-msvc-${{ env.VCPKG_SUBMODULE_SHA }}-

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'
          cache: true
          add-tools-to-path: true
      
      - name: Configure CMake
        run: cmake --preset windows-msvc-release -DVELOCITY_SIDELOAD_QT=OFF -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
        shell: pwsh
      
      - name: Build
        run: cmake --build --preset windows-msvc-release
      
      - name: Package
        run: |
          mkdir release-msvc
          cp out/build/windows-msvc-release/VelocityNext/VelocityNext.exe release-msvc/
          cp out/build/windows-msvc-release/XboxInternals/XboxInternals.dll release-msvc/
          windeployqt release-msvc/VelocityNext.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Next-Windows-MSVC
          path: release-msvc/
