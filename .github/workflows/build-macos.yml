name: Build macOS

on:
  workflow_dispatch:  # manual only

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_SUBMODULE_SHA=$(git rev-parse HEAD:externals/vcpkg)" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-macos-${{ env.VCPKG_SUBMODULE_SHA }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-macos-${{ env.VCPKG_SUBMODULE_SHA }}-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.4'
          host: 'mac'
          target: 'desktop'
          modules: 'qtnetworkauth'
          cache: true
      
      - name: Configure CMake
        run: cmake --preset macos-release -DVELOCITY_SIDELOAD_QT=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      
      - name: Build
        run: cmake --build --preset macos-release
      
      - name: Deploy Qt dependencies
        run: |
          chmod +x deploy_mac.sh
          ./deploy_mac.sh out/build/macos-release
      
      - name: Create DMG
        run: |
          mkdir dmg-contents
          cp -R out/build/macos-release/VelocityNext/VelocityNext.app dmg-contents/
          hdiutil create -volname "Velocity-Next" -srcfolder dmg-contents -ov -format UDZO Velocity-Next-macOS.dmg
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Next-macOS
          path: Velocity-Next-macOS.dmg
