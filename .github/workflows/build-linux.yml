name: Build Linux

on:
  workflow_dispatch:  # manual only

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_SUBMODULE_SHA=$(git rev-parse HEAD:externals/vcpkg)" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ env.VCPKG_SUBMODULE_SHA }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-${{ env.VCPKG_SUBMODULE_SHA }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'linux'
          target: 'desktop'
          modules: 'qtnetworkauth'
          cache: true
      
      - name: Configure CMake
        run: cmake --preset linux-release -DVELOCITY_SIDELOAD_QT=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      
      - name: Build
        run: cmake --build --preset linux-release
      
      - name: Package
        run: |
          mkdir release-linux
          cp out/build/linux-release/VelocityNext/VelocityNext release-linux/
          cp out/build/linux-release/XboxInternals/libXboxInternals.so release-linux/
          cd release-linux
          tar -czf ../Velocity-Next-Linux.tar.gz *
      
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Velocity-Next-Linux
          path: Velocity-Next-Linux.tar.gz
